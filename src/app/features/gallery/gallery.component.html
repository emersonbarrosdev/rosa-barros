<section class="gallery-section" id="gallery">
  <div class="gallery-container">
    <!-- Cabeçalho -->
    <div class="section-header text-center">
      <span class="section-eyebrow">PORTFÓLIO GASTRONÔMICO</span>
      <h2 class="section-title">GALERIA DE CRIAÇÕES</h2>
      <p class="section-lead">
        Uma celebração visual da alta gastronomia. Cada prato é uma composição harmônica entre sabor autêntico, técnica refinada e apresentação impecável.
      </p>
    </div>

    <!-- Grid de Imagens -->
    <div class="gallery-grid">
      <div *ngFor="let photo of visiblePhotos; let i = index" 
           class="gallery-item"
           (click)="openLightbox(i)">
        <div class="image-frame">
          <img [src]="'assets/image/galeria/' + photo + '.png'" 
               [alt]="'Prato gastronômico ' + photo + ' por Rosa Barros'"
               class="gallery-img"
               loading="lazy">
          <div class="gallery-overlay">
            <span class="material-icons zoom-icon">zoom_in</span>
            <span class="overlay-text">Visualizar Prato</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Botão de Expandir / Recolher Galeria -->
    <div class="text-center mt-5">
      <button type="button" class="btn-toggle-gallery" (click)="toggleShowAll()">
        <span class="material-icons">{{ showAll ? 'grid_view' : 'collections' }}</span>
        <span>{{ showAll ? 'Mostrar Menos Fotos' : 'Ver Galeria Completa (' + allPhotos.length + ' Pratos)' }}</span>
      </button>
    </div>
  </div>

  <!-- Modal Lightbox Interativo -->
  <div *ngIf="selectedPhotoIndex !== null" class="lightbox-backdrop" (click)="closeLightbox()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <!-- Botão Fechar -->
      <button class="lightbox-close" (click)="closeLightbox()" aria-label="Fechar visualização">
        <span class="material-icons">close</span>
      </button>

      <!-- Botão Anterior -->
      <button class="lightbox-prev" (click)="prevPhoto($event)" aria-label="Foto anterior">
        <span class="material-icons">chevron_left</span>
      </button>

      <!-- Imagem em Destaque -->
      <div class="lightbox-image-wrapper">
        <img [src]="'assets/image/galeria/' + allPhotos[selectedPhotoIndex] + '.png'" 
             [alt]="'Prato gastronômico ' + allPhotos[selectedPhotoIndex]"
             class="lightbox-img">
        <div class="lightbox-counter">
          {{ selectedPhotoIndex + 1 }} de {{ allPhotos.length }}
        </div>
      </div>

      <!-- Próximo Botão -->
      <button class="lightbox-next" (click)="nextPhoto($event)" aria-label="Próxima foto">
        <span class="material-icons">chevron_right</span>
      </button>
    </div>
  </div>
</section>
